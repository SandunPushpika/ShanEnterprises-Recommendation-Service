name: Deploy Recommendation API

on:
  push:
    branches:
      - release/**

env:
  IMAGE_NAME: recommendation-system
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
    # Checkout source code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build Docker image
    - name: Build Docker image
      run: |

        docker build \
        -t $DOCKER_USERNAME/$IMAGE_NAME:${{ github.sha }} \
        .

    # Push image to Docker Hub
    - name: Push Docker image
      run: |

        docker push \
        $DOCKER_USERNAME/$IMAGE_NAME:${{ github.sha }}

    # Login Azure
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Deploy image to Azure App Service
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:

        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}

        images: |
          docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}